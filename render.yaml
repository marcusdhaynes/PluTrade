# Explicitly inactive until secure credentials and live recovery verification exist.
services:
  - type: worker
    name: plutrade-market-ingestor
    runtime: docker
    branch: main
    dockerfilePath: ./services/ingest-worker/Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    envVars:
      - key: PLUTRADE_DATABASE_URL
        sync: false
      - key: PLUTRADE_COINBASE_PRODUCT
        value: BTC-USD
      - key: PLUTRADE_MARKET_ID
        value: BTCUSD|Coinbase|spot
