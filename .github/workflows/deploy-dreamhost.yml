name: Deploy to plutrade.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: plutrade-dreamhost-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run typecheck, strategy/chart regression tests and market proxy CORS checks
        run: |
          pnpm run lint
          pnpm run test:paper
          node --test services/market-proxy/api/history.test.mjs
          if command -v php >/dev/null 2>&1; then php -l public/api/kraken-history.php; else echo '::warning::PHP lint CLI unavailable'; fi

      - name: Build production bundle
        run: pnpm run build

      - name: Validate build output
        run: |
          test -s dist/index.html
          test -s dist/api/kraken-history.php
          grep -q 'PluTrade' dist/index.html

      - name: Add SPA fallback .htaccess
        run: |
          cat > dist/.htaccess <<'EOF'
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          RewriteRule ^ index.html [L]
          EOF

      - name: Deploy to DreamHost over SSH (rsync + deploy key)
        env:
          SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete --exclude='.dh-diag' \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ \
            "${{ secrets.DREAMHOST_SFTP_USER }}@${{ secrets.DREAMHOST_SFTP_HOST }}:/home/marcusdhaynes/plutrade.com/"

      - name: Probe deployed same-origin Kraken history (report only)
        shell: bash
        run: |
          set -uo pipefail
          endpoint='https://plutrade.com/api/kraken-history.php?symbol=PF_ARBUSD&resolution=1m'
          body="${RUNNER_TEMP}/plutrade-kraken-history.json"
          if ! curl --fail --silent --show-error --max-time 25 --retry 2 --retry-delay 3 -H 'Cache-Control: no-cache' --output "$body" "$endpoint"; then
            echo '::warning::Kraken production history HTTP endpoint unavailable; do not claim live futures candles work.'
            exit 0
          fi
          if ! HISTORY_PATH="$body" node -e "
            const fs=require('node:fs');
            const data=JSON.parse(fs.readFileSync(process.env.HISTORY_PATH,'utf8'));
            if(!Array.isArray(data.candles))process.exit(2);
            console.log('Production PHP endpoint returned '+data.candles.length+' Kraken Futures candles.');
            if(data.candles.length===0)process.exit(3);
          "; then
            echo '::warning::Kraken endpoint did not return nonempty verified candles.'
          fi
